[phases.setup]
nixPkgs = [
    "php83",
    "php83Packages.composer",
    "php83Extensions.pdo_mysql",
    "php83Extensions.mbstring",
    "php83Extensions.openssl",
    "php83Extensions.gd",
    "php83Extensions.bcmath",
    "php83Extensions.xml",
    "php83Extensions.zip",
    "python311Packages.supervisor",
    "nodejs_22",  # Mise à jour pour Vite 7
    "nginx"
]

[phases.install]
cmds = [
    "composer install --no-dev --no-interaction --optimize-autoloader --no-scripts",
    "npm install --legacy-peer-deps"
]

[phases.build]
dependsOn = ["install"]
cmds = [
    "npm run build",
    "chmod +x /assets/start.sh",
    "php artisan optimize:clear"
]

[start]
cmd = 'bash /assets/start.sh'

[staticAssets]
"start.sh" = '''
#!/bin/bash
cd /app

# Création des dossiers de survie pour Nginx et PHP
mkdir -p /var/log/nginx /var/cache/nginx /tmp/nginx
chmod -R 777 storage bootstrap/cache /tmp

echo "Running migrations..."
if [ -d "vendor" ]; then
    php artisan migrate --force
fi

node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf
exec supervisord -c /assets/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /assets/worker-*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/tmp/worker-nginx.log
stderr_logfile=/tmp/worker-nginx.log
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/tmp/worker-phpfpm.log
stderr_logfile=/tmp/worker-phpfpm.log
'''

"worker-laravel.conf" = '''
[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
numprocs=2
autostart=true
autorestart=true
stdout_logfile=/tmp/worker-laravel.log
stderr_logfile=/tmp/worker-laravel.log
'''

"php-fpm.conf" = '''
[global]
error_log = /tmp/php-fpm.log

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
'''

"nginx.template.conf" = '''
worker_processes auto;
daemon off;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include $!{nginx}/conf/mime.types;
    access_log /tmp/nginx-access.log;
    error_log /tmp/nginx-error.log;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;

    server {
        listen ${PORT};
        server_name localhost;
        root /app/public; # Laravel utilise le dossier public
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
        }
    }
}
'''
